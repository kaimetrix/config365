[supervisord]
; Run in foreground so Docker/Azure can capture logs via stdout
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=info
user=root

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

; ── Caddy ─────────────────────────────────────────────────────────────────────
; Priority 5 — starts before everything else.
; Listens on :80 inside the container and routes /gitea/* → Gitea (3000), /* → portal (4321).
; Docker publishes Caddy as host port PORTAL_HTTP_PORT (default 8080 in .env).
; Azure App Service / Container Apps expose container port 80 directly (no host remap).
[program:caddy]
command=/usr/local/bin/caddy run --config /etc/caddy/Caddyfile
directory=/tmp
autostart=true
autorestart=true
startretries=5
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=5

; ── Gitea ─────────────────────────────────────────────────────────────────────
; Priority 10 — starts first; portal and runner depend on it being ready
; Runs as the 'git' user — Gitea refuses to start as root
[program:gitea]
command=/usr/local/bin/gitea web --config /data/gitea/conf/app.ini
directory=/data/gitea
user=git
environment=GITEA_WORK_DIR="/data/gitea",GITEA_CUSTOM="/data/gitea/custom",HOME="/home/git"
autostart=true
autorestart=true
startretries=5
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=10

; ── Portal ────────────────────────────────────────────────────────────────────
; Priority 15 — starts after Gitea (10). portal-warmup (20) polls it for
; readiness and pre-loads the module bundle before real traffic arrives.
[program:portal]
command=/usr/bin/node /app/server.js
directory=/app
environment=NODE_ENV="production",HOSTNAME="0.0.0.0",PORT="4321",NEXT_TELEMETRY_DISABLED="1",GITEA_INTERNAL_URL="http://127.0.0.1:3000",INIT_DATA_DIR="/data/init-data",DB_PATH="/data/db/config365.db",CONFIG365_ROOT="/app"
autostart=true
autorestart=true
startretries=5
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=15

; ── Portal warmup ─────────────────────────────────────────────────────────────
; Priority 20 — runs once after the portal starts (15). Polls /api/health until
; Next.js is accepting connections, then fires warmup GETs to pre-load the
; module bundle so the first real user request is not the cold one.
[program:portal-warmup]
command=/usr/local/bin/portal-warmup.sh
directory=/tmp
autostart=true
autorestart=false
startretries=0
startsecs=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=20

; ── Token API ─────────────────────────────────────────────────────────────────
; Priority 25 — starts after portal (20), before runner (30).
; Runs on port 4322 (internal Docker network only — no Caddy routing, no ports: mapping).
; Token encryption key is auto-generated in platform_settings on first use (see settings-store.ts).
; SESSION_SECRET is injected by entrypoint-aio.sh (required for settings decryption
; and for calling the portal internal tenant lookup API).
[program:token-api]
command=/usr/bin/node /app/token-api-server.mjs
directory=/app
environment=NODE_ENV="production",MAIN_DB_PATH="/data/db/config365.db",DB_PATH="/data/db/config365.db",TOKEN_DB_PATH="/data/db/tokens.db",INTERNAL_API_PORT="4322",PORTAL_INTERNAL_URL="http://127.0.0.1:4321"
autostart=true
autorestart=true
startretries=5
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=25

; ── Backup Scheduler ──────────────────────────────────────────────────────────
; Priority 35 — starts after runner. Disabled by default; entrypoint-aio.sh
; enables autostart=true if blob storage is configured in platform_settings.
[program:backup-scheduler]
command=/usr/local/bin/backup-cron-wrapper.sh
directory=/data
environment=NODE_ENV="production",DB_PATH="/data/db/config365.db",GITEA_DATA="/data/gitea",GITEA_APP_INI="/data/gitea/conf/app.ini"
autostart=false
autorestart=true
startretries=3
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=35

; ── act_runner shards ─────────────────────────────────────────────────────────
; Generated at startup by setup-runner-shards.sh (N programs: runner-1 … runner-N).
; Each shard runs capacity=1 to avoid host-mode parallel deadlocks.
[include]
files = /etc/supervisord.d/runners.conf
