# Config365 â€” Tenant Backup Pipeline
#
# This file is the canonical template stored in config365/orchestrator.
# Tenant repos contain an identical copy at .gitea/workflows/backup.yml.
# The "Sync pipeline" step keeps them in sync automatically â€” changes here
# apply to all tenants on their next run.
#
# Required org-level secrets (MSP Gitea org -- available via secrets: inherit):
#   PORTAL_INTERNAL_KEY  - Shared secret for the internal token API (Gitea masks it)
#
# Required repo-level vars (set per tenant):
#   TENANT_SLUG          - Tenant identifier matching the Config365 database slug
#
# Optional repo-level secrets (Exchange Online):
#   EXCHANGE_ORG         - Exchange Online org name (e.g. contoso)
#
# NOTE: CLIENT_ID, CLIENT_SECRET, TENANT_ID are no longer used.
# Connect-M365Graph.ps1 fetches delegated tokens from the token API (PORTAL_TOKEN_API_URL, defaults to http://localhost:4322).

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      debug_mode:
        description: 'Enable verbose output'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: backup-${{ gitea.repository }}
  cancel-in-progress: false

jobs:
  backup:
    name: Export M365 Configurations
    runs-on: self-hosted
    env:
      GITEA_RUN_ID: ${{ gitea.run_id }}
      HOME: /tmp/act-jobs/${{ gitea.run_id }}
      USERPROFILE: /tmp/act-jobs/${{ gitea.run_id }}
      XDG_CACHE_HOME: /tmp/act-jobs/${{ gitea.run_id }}/.cache
      PORTAL_INTERNAL_KEY: ${{ secrets.PORTAL_INTERNAL_KEY }}
      TENANT_SLUG: ${{ vars.TENANT_SLUG }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      # Per-item backup fetch failures (transient Graph/Intune 5xx, throttling, etc.) are
      # appended here (Add-BackupItemFailure in Backup-Common.ps1) so the "Protect Failed
      # Backup Items" step can restore them from HEAD instead of letting them look like a
      # deletion. Isolated per job run; never committed (lives outside the tenant checkout).
      BACKUP_FAILURES_FILE: /tmp/act-jobs/${{ gitea.run_id }}/backup-item-failures.jsonl
    steps:
      - name: Initialize Job Session Isolation
        shell: bash
        run: |
          mkdir -p "$HOME" "$XDG_CACHE_HOME"
          export USERPROFILE="$HOME"
          mkdir -p "$USERPROFILE/.azure" "$USERPROFILE/.local/share"
          for f in .gitconfig .git-credentials .netrc; do
            [ -f "/root/$f" ] && cp "/root/$f" "$HOME/$f"
          done
          # Git 2.35+ rejects checkouts when workspace bind-mount path
          # (/data/...) differs from the host path Git resolves
          # (/home/config365-data/...). Mark all dirs safe for this job.
          git config --global --add safe.directory '*'
          echo "Job session HOME=$HOME USERPROFILE=$USERPROFILE"
      # â”€â”€ Checkout tenant repo â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Checkout Tenant Repository
        run: git clone ${{ gitea.server_url }}/${{ gitea.repository }} tenant

      # â”€â”€ Checkout orchestrator (scripts + pipeline template) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Checkout Orchestrator
        run: git clone ${{ gitea.server_url }}/${{ vars.PLATFORM_ORG }}/orchestrator scripts

      # â”€â”€ Sync pipeline from orchestrator â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      # Compares the orchestrator's backup-pipeline.yml with this tenant's
      # backup.yml. If they differ, updates backup.yml and commits so the
      # next run automatically picks up any pipeline changes.
      - name: Sync pipeline from orchestrator
        run: |
          orch_file="${{ gitea.workspace }}/scripts/.gitea/workflows/backup-pipeline.yml"
          tenant_file="${{ gitea.workspace }}/tenant/.gitea/workflows/backup.yml"
          if ! cmp -s "$orch_file" "$tenant_file"; then
            echo "Pipeline differs from orchestrator - syncing..."
            cp "$orch_file" "$tenant_file"
            cd "${{ gitea.workspace }}/tenant"
            git config --global --add safe.directory '*'
            git config user.email "config365-bot@config365.local"
            git config user.name  "Config365 Bot"
            git add .gitea/workflows/backup.yml
            git commit -m "sync: update pipeline from config365/orchestrator"
            git pull --rebase origin ${{ gitea.ref_name }}
            git push origin HEAD:${{ gitea.ref_name }}
            echo "Pipeline synced. New steps will apply on next run."
          else
            echo "Pipeline is up to date."
          fi

      # -- Assign required directory roles ──────────────────────────────────────────────────
      - name: Prepare - Assign Required Directory Roles
        id: step_prepare_roles
        continue-on-error: true
        shell: pwsh
        run: |
          & "${{ gitea.workspace }}/scripts/graph-configs/Prepare-TenantRoles.ps1" `
            -Verbose:$${{ inputs.debug_mode || false }}

      - name: Initialize Backup Directory
        shell: pwsh
        run: |
          $backupPath = "${{ gitea.workspace }}/tenant/backups"
          if (Test-Path $backupPath) {
            # Retained across runs (date-keyed / cumulative data):
            #   logs            — pipeline logs
            #   signin-logs     — daily sign-in log files (90-day retention in script)
            #   secure-score    — history/ daily score files (Write-HistoryFileIfMissing skips existing dates)
            Get-ChildItem -Path $backupPath |
              Where-Object { $_.Name -notin @('logs', 'signin-logs', 'secure-score') } |
              Remove-Item -Recurse -Force
            Write-Host "Cleared previous backup files from: $backupPath"
          }
          New-Item -ItemType Directory -Path $backupPath -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $backupPath 'logs') -Force | Out-Null
          Write-Host "Backup directory ready"

      # â”€â”€ 1. Backup: Groups â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Backup - Groups
        id: step_backup_groups
        continue-on-error: true
        shell: pwsh
        run: |
          $backupPath = "${{ gitea.workspace }}/tenant/backups"
          $scriptDir  = "${{ gitea.workspace }}/scripts/backup"
          . "$scriptDir/Backup-Common.ps1"
          $script:BackupPath = $backupPath
          Initialize-BackupLogging -BackupPath $backupPath -DebugMode:$${{ inputs.debug_mode || false }}
          $connected = Connect-M365Backup
          if (-not $connected) { throw "Failed to connect to Microsoft Graph" }
          . "$scriptDir/Backup-Groups.ps1" -BackupPath $backupPath -DebugMode:$${{ inputs.debug_mode || false }}
        env:
          PORTAL_INTERNAL_KEY: ${{ secrets.PORTAL_INTERNAL_KEY }}
          TENANT_SLUG: ${{ vars.TENANT_SLUG }}

      # â”€â”€ 1b. Backup: Licenses â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

      # ── 1b. Backup: Group Membership ─────────────────────────────────────────
      - name: Backup - Group Membership
        id: step_backup_group_membership
        continue-on-error: true
        shell: pwsh
        run: |
          $backupPath = "${{ gitea.workspace }}/tenant/backups"
          $scriptDir  = "${{ gitea.workspace }}/scripts/backup"
          . "$scriptDir/Backup-Common.ps1"
          $script:BackupPath = $backupPath
          Initialize-BackupLogging -BackupPath $backupPath -DebugMode:$${{ inputs.debug_mode || false }}
          $connected = Connect-M365Backup
          if (-not $connected) { throw "Failed to connect to Microsoft Graph" }
          . "$scriptDir/Backup-GroupMembership.ps1" -BackupPath $backupPath -DebugMode:$${{ inputs.debug_mode || false }}
        env:
          PORTAL_INTERNAL_KEY: ${{ secrets.PORTAL_INTERNAL_KEY }}
          TENANT_SLUG: ${{ vars.TENANT_SLUG }}
      - name: Backup - Licenses
        id: step_backup_licenses
        continue-on-error: true
        shell: pwsh
        run: |
          $backupPath = "${{ gitea.workspace }}/tenant/backups"
