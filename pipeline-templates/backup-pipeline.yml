          TENANT_SLUG: ${{ vars.TENANT_SLUG }}

      # â”€â”€ 7e. Backup: Defender for Endpoint Devices â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Backup - Defender for Endpoint Devices
        id: step_backup_defender
        continue-on-error: true
        timeout-minutes: 30
        shell: pwsh
        run: |
          $backupPath = "${{ gitea.workspace }}/tenant/backups"
          $scriptDir  = "${{ gitea.workspace }}/scripts/backup"
          . "$scriptDir/Backup-Common.ps1"
          $script:BackupPath = $backupPath
          Initialize-BackupLogging -BackupPath $backupPath -DebugMode:$${{ inputs.debug_mode || false }}
          . "$scriptDir/Backup-DefenderDevices.ps1" -BackupPath $backupPath -DebugMode:$${{ inputs.debug_mode || false }}
        env:
          PORTAL_INTERNAL_KEY: ${{ secrets.PORTAL_INTERNAL_KEY }}
          TENANT_SLUG: ${{ vars.TENANT_SLUG }}

      # â”€â”€ 7f. Backup: Intune Device Compliance Data â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Backup - Intune Device Compliance Data
        id: step_backup_intune_devices
        continue-on-error: true
        timeout-minutes: 30
        shell: pwsh
        run: |
          $backupPath = "${{ gitea.workspace }}/tenant/backups"
          $scriptDir  = "${{ gitea.workspace }}/scripts/backup"
          . "$scriptDir/Backup-Common.ps1"
          $script:BackupPath = $backupPath
          Initialize-BackupLogging -BackupPath $backupPath -DebugMode:$${{ inputs.debug_mode || false }}
          $connected = Connect-M365Backup
          if (-not $connected) { throw "Failed to connect to Microsoft Graph" }
          . "$scriptDir/Backup-IntuneDevices.ps1" -BackupPath $backupPath -DebugMode:$${{ inputs.debug_mode || false }}
        env:
          PORTAL_INTERNAL_KEY: ${{ secrets.PORTAL_INTERNAL_KEY }}
          TENANT_SLUG: ${{ vars.TENANT_SLUG }}

      # â”€â”€ 8. Backup: Exchange Online â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Backup - Exchange Online
        id: step_backup_exchange
        continue-on-error: true
        shell: pwsh
        run: |
          $backupPath = "${{ gitea.workspace }}/tenant/backups"
          $scriptDir  = "${{ gitea.workspace }}/scripts/backup"
          . "$scriptDir/Backup-Common.ps1"
          $script:BackupPath = $backupPath
          Initialize-BackupLogging -BackupPath $backupPath -DebugMode:$${{ inputs.debug_mode || false }}
          $connected = Connect-M365Backup
          if (-not $connected) { throw "Failed to connect to Microsoft Graph" }
          . "$scriptDir/Backup-Exchange.ps1" -BackupPath $backupPath
        env:
          PORTAL_INTERNAL_KEY: ${{ secrets.PORTAL_INTERNAL_KEY }}
          TENANT_SLUG: ${{ vars.TENANT_SLUG }}
          EXCHANGE_ORG_NAME: ${{ secrets.EXCHANGE_ORG }}

      - name: Backup - Exchange Message Encryption (IRM/OME)
        id: step_backup_exchange_message_encryption
        continue-on-error: true
        shell: pwsh
        run: |
          $backupPath = "${{ gitea.workspace }}/tenant/backups"
          $scriptDir  = "${{ gitea.workspace }}/scripts/backup"
          . "$scriptDir/Backup-Common.ps1"
          $script:BackupPath = $backupPath
          Initialize-BackupLogging -BackupPath $backupPath -DebugMode:$${{ inputs.debug_mode || false }}
          . "$scriptDir/Backup-ExchangeMessageEncryption.ps1" -BackupPath $backupPath -DebugMode:$${{ inputs.debug_mode || false }}
        env:
          PORTAL_INTERNAL_KEY: ${{ secrets.PORTAL_INTERNAL_KEY }}
          TENANT_SLUG: ${{ vars.TENANT_SLUG }}
          EXCHANGE_ORG_NAME: ${{ secrets.EXCHANGE_ORG }}

      # â”€â”€ 9. Backup: Enterprise Applications â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Backup - Information Protection
        id: step_backup_information_protection
        continue-on-error: true
        shell: pwsh
        run: |
          $backupPath = "${{ gitea.workspace }}/tenant/backups"
          $scriptDir  = "${{ gitea.workspace }}/scripts/backup"
          . "$scriptDir/Backup-Common.ps1"
          $script:BackupPath = $backupPath
          Initialize-BackupLogging -BackupPath $backupPath -DebugMode:$${{ inputs.debug_mode || false }}
          . "$scriptDir/Backup-InformationProtection.ps1" -BackupPath $backupPath
        env:
          PORTAL_INTERNAL_KEY: ${{ secrets.PORTAL_INTERNAL_KEY }}
          TENANT_SLUG: ${{ vars.TENANT_SLUG }}
          EXCHANGE_ORG_NAME: ${{ secrets.EXCHANGE_ORG }}

      - name: Backup - Enterprise Applications
        id: step_backup_enterprise_apps
        continue-on-error: true
        shell: pwsh
        run: |
          $backupPath = "${{ gitea.workspace }}/tenant/backups"
          $scriptDir  = "${{ gitea.workspace }}/scripts/backup"
          . "$scriptDir/Backup-Common.ps1"
          $script:BackupPath = $backupPath
          Initialize-BackupLogging -BackupPath $backupPath -DebugMode:$${{ inputs.debug_mode || false }}
          $connected = Connect-M365Backup
          if (-not $connected) { throw "Failed to connect to Microsoft Graph" }
          . "$scriptDir/Backup-EnterpriseApps.ps1" -BackupPath $backupPath -DebugMode:$${{ inputs.debug_mode || false }}
        env:
          PORTAL_INTERNAL_KEY: ${{ secrets.PORTAL_INTERNAL_KEY }}
          TENANT_SLUG: ${{ vars.TENANT_SLUG }}

      # â”€â”€ 10. Resolve: Translate IDs to Placeholders â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      # ── 10. Backup: Entra Sign-In Logs ──────────────────────────────────────────
      # Requires Entra ID P1 or P2. Exits cleanly with a warning on 403.
      # UTC daily files; re-refreshes days overlapping the last 7d time window (includes today).
      - name: Backup - Sign-In Logs
        id: step_backup_signin
        continue-on-error: true
        timeout-minutes: 90
        shell: pwsh
        run: |
          $backupPath = "${{ gitea.workspace }}/tenant/backups"
          $scriptDir  = "${{ gitea.workspace }}/scripts/backup"
          . "$scriptDir/Backup-Common.ps1"
          $script:BackupPath = $backupPath
          Initialize-BackupLogging -BackupPath $backupPath -DebugMode:$${{ inputs.debug_mode || false }}
          $connected = Connect-M365Backup
          if (-not $connected) { throw "Failed to connect to Microsoft Graph" }
          . "$scriptDir/Backup-SignInLogs.ps1" -BackupPath $backupPath -DebugMode:$${{ inputs.debug_mode || false }}
        env:
          PORTAL_INTERNAL_KEY: ${{ secrets.PORTAL_INTERNAL_KEY }}
          TENANT_SLUG: ${{ vars.TENANT_SLUG }}

      # ── 11. Backup: Secure Score ─────────────────────────────────────────────────
      # Requires SecurityEvents.Read.All. Exits cleanly with a warning on 403.
      - name: Backup - Secure Score
        id: step_backup_secure_score
        continue-on-error: true
        shell: pwsh
        run: |
          $backupPath = "${{ gitea.workspace }}/tenant/backups"
          $scriptDir  = "${{ gitea.workspace }}/scripts/backup"
          . "$scriptDir/Backup-Common.ps1"
          $script:BackupPath = $backupPath
          Initialize-BackupLogging -BackupPath $backupPath -DebugMode:$${{ inputs.debug_mode || false }}
          $connected = Connect-M365Backup
          if (-not $connected) { throw "Failed to connect to Microsoft Graph" }
          . "$scriptDir/Backup-SecureScore.ps1" -BackupPath $backupPath -DebugMode:$${{ inputs.debug_mode || false }}
        env:
          PORTAL_INTERNAL_KEY: ${{ secrets.PORTAL_INTERNAL_KEY }}
          TENANT_SLUG: ${{ vars.TENANT_SLUG }}

      - name: Resolve - Translate IDs to Placeholders
        id: step_resolve_ids
        continue-on-error: true
        shell: pwsh
        run: |
          & "${{ gitea.workspace }}/scripts/backup/Resolve-BackupPlaceholders.ps1" `
            -BackupPath "${{ gitea.workspace }}/tenant/backups" `
            -DebugMode:$${{ inputs.debug_mode || false }}
        env:
          PORTAL_INTERNAL_KEY: ${{ secrets.PORTAL_INTERNAL_KEY }}
          TENANT_SLUG: ${{ vars.TENANT_SLUG }}
          EXCHANGE_ORG_NAME: ${{ secrets.EXCHANGE_ORG }}

      # ── Validate backup steps ───────────────────────────────────────────────────
      # Must run before manifest/commit. The init step wipes backups/ at the start;
      # committing after a partial run would push missing files as deletions in git.
      - name: Validate Backup Steps
        id: validate_backup
        if: always()
        shell: bash
        run: |
          FAILED=0
          [[ "${{ steps.step_prepare_roles.outcome }}"           == "failure" ]] && FAILED=1
          [[ "${{ steps.step_backup_groups.outcome }}"           == "failure" ]] && FAILED=1
          [[ "${{ steps.step_backup_group_membership.outcome }}" == "failure" ]] && FAILED=1
          [[ "${{ steps.step_backup_licenses.outcome }}"         == "failure" ]] && FAILED=1
          [[ "${{ steps.step_backup_ca.outcome }}"               == "failure" ]] && FAILED=1
          [[ "${{ steps.step_backup_custom_attrs.outcome }}"     == "failure" ]] && FAILED=1
          [[ "${{ steps.step_backup_auth_policies.outcome }}"    == "failure" ]] && FAILED=1
          [[ "${{ steps.step_backup_sharepoint.outcome }}"       == "failure" ]] && FAILED=1
          [[ "${{ steps.step_backup_consent.outcome }}"          == "failure" ]] && FAILED=1
          [[ "${{ steps.step_backup_intune.outcome }}"           == "failure" ]] && FAILED=1
          [[ "${{ steps.step_backup_choco.outcome }}"            == "failure" ]] && FAILED=1
          [[ "${{ steps.step_backup_winget.outcome }}"           == "failure" ]] && FAILED=1
          [[ "${{ steps.step_backup_custom_apps.outcome }}"      == "failure" ]] && FAILED=1
          [[ "${{ steps.step_backup_defender.outcome }}"         == "failure" ]] && FAILED=1
          [[ "${{ steps.step_backup_exchange.outcome }}"         == "failure" ]] && FAILED=1
          [[ "${{ steps.step_backup_enterprise_apps.outcome }}"  == "failure" ]] && FAILED=1
          [[ "${{ steps.step_backup_signin.outcome }}"           == "failure" ]] && FAILED=1
          [[ "${{ steps.step_backup_secure_score.outcome }}"     == "failure" ]] && FAILED=1
          [[ "${{ steps.step_resolve_ids.outcome }}"             == "failure" ]] && FAILED=1
          if [ $FAILED -eq 1 ]; then
            echo "One or more backup steps failed."
            echo "Skipping manifest generation and git commit to avoid partial backup data."
            exit 1
          fi
          echo "All backup steps completed successfully."

      - name: Backup Commit Skipped
        if: always() && steps.validate_backup.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Host "==========================================" -ForegroundColor Yellow
          Write-Host "  BACKUP COMMIT SKIPPED" -ForegroundColor Yellow
          Write-Host "==========================================" -ForegroundColor Yellow
          Write-Host ""
          Write-Host "One or more backup steps failed. Partial export data was discarded."
          Write-Host "The tenant git repo was NOT updated — previous backup remains intact."
          Write-Host "Fix the failing step(s) and re-run the backup pipeline."

      # â”€â”€ Generate Backup Manifest â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Generate Backup Manifest
        if: steps.validate_backup.outcome == 'success'
        shell: pwsh
        run: |
          $backupPath   = "${{ gitea.workspace }}/tenant/backups"
          $manifestPath = Join-Path $backupPath "backup-manifest.json"

          $components = @{}
          $subdirs = @(
            @{ Name = "Groups";                 Dir = "groups" },
            @{ Name = "Licenses";               Dir = "licenses" },
            @{ Name = "ConditionalAccess";      Dir = "conditional-access" },
            @{ Name = "CustomAttributes";       Dir = "custom-attributes" },
            @{ Name = "AuthenticationPolicies"; Dir = "authentication-policies" },
            @{ Name = "EntraIDSettings";        Dir = "entra-id-device-settings" },
            @{ Name = "DefenderConnector";      Dir = "intune/defender-connector" },
            @{ Name = "SharePointSettings";     Dir = "sharepoint-settings" },
            @{ Name = "ConsentPermissions";     Dir = "consent-permissions" },
            @{ Name = "Intune";                 Dir = "intune" },
            @{ Name = "ChocoApps";              Dir = "intune/apps/chocolatey" },
            @{ Name = "WingetApps";             Dir = "intune/apps/winget" },
            @{ Name = "CustomApps";             Dir = "intune/apps/custom" },
            @{ Name = "PrinterApps";            Dir = "intune/apps/printer" },
            @{ Name = "Exchange";               Dir = "exchange" },
            @{ Name = "EnterpriseApps";         Dir = "enterprise-apps" },
            @{ Name = "DefenderDevices";        Dir = "defender-devices" },
            @{ Name = "SignInLogs";             Dir = "signin-logs" },
            @{ Name = "SecureScore";            Dir = "secure-score" }
          )

          foreach ($entry in $subdirs) {
            $dirPath = Join-Path $backupPath $entry.Dir
            if (Test-Path $dirPath) {
              $count = (Get-ChildItem -Path $dirPath -Recurse -File -ErrorAction SilentlyContinue).Count
              $components[$entry.Name] = @{ BackedUp = $count; Failed = 0 }
            }
          }

          $manifest = @{
            BackupType         = "M365Configuration"
            BackupTimestamp    = (Get-Date -Format 'yyyy-MM-ddTHH:mm:ss')
            CompletedTimestamp = (Get-Date -Format 'yyyy-MM-ddTHH:mm:ss')
            DurationSeconds    = 0
            DebugMode          = [bool]$${{ inputs.debug_mode || false }}
            RunId              = "${{ gitea.run_id }}"
            TriggerEvent       = "${{ gitea.event_name }}"
            BackupSource       = "GiteaActions"
            Components         = $components
          }

          $manifest | ConvertTo-Json -Depth 10 | Out-File -FilePath $manifestPath -Encoding UTF8
          Write-Host "Backup manifest generated"
          Write-Host (Get-Content $manifestPath | Out-String)

      # â”€â”€ Commit and Push Backup â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Commit and Push Backup
        if: steps.validate_backup.outcome == 'success'
        shell: pwsh
        run: |
          Set-Location "${{ gitea.workspace }}/tenant"

          git config --global --add safe.directory '*'
          git config user.email "config365-bot@config365.local"
          git config user.name  "Config365 Bot"

          git fetch origin ${{ gitea.ref_name }}

          git add -A "backups/"

          if (Test-Path "${{ gitea.workspace }}/scripts/backup/Protect-FailedBackupItems.ps1") {
            & "${{ gitea.workspace }}/scripts/backup/Protect-FailedBackupItems.ps1" `
              -BackupPath "backups"
          }

          if (Test-Path "${{ gitea.workspace }}/scripts/backup/Skip-ReorderOnlyChanges.ps1") {
            & "${{ gitea.workspace }}/scripts/backup/Skip-ReorderOnlyChanges.ps1" `
              -BackupPath "backups"
          }

          $status = git status --porcelain
          if ($status) {
            $timestamp = Get-Date -Format 'yyyy-MM-dd HH:mm:ss'
            $prefix = if ("${{ gitea.event_name }}" -eq "schedule") { "Scheduled backup" } else { "Manual backup" }
            $msg  = "${prefix}: ${timestamp}`n`n"
            $msg += "Run ID: ${{ gitea.run_id }}`n"
            $msg += "Tenant: ${{ vars.TENANT_NAME }}"
            git commit -m $msg
            git restore .
            git pull --rebase origin ${{ gitea.ref_name }}
            git push origin HEAD:${{ gitea.ref_name }}
            Write-Host "Backup committed and pushed successfully"
          } else {
            Write-Host "No changes to commit"
          }

      # â”€â”€ Summary â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Backup Summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== M365 Configuration Backup Summary ==="
          Write-Host "Backup Date : $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
          Write-Host "Run ID      : ${{ gitea.run_id }}"
          Write-Host "Tenant      : ${{ vars.TENANT_NAME }}"
          Write-Host "Event       : ${{ gitea.event_name }}"
          Write-Host ""
          Write-Host "Backed up components:"
          Write-Host "   1  - Groups"
          Write-Host "  1b  - Licenses (subscribed SKUs)"
          Write-Host "   2  - Conditional Access Policies"
          Write-Host "   3  - Custom Security Attributes"
          Write-Host "   4  - Authentication Policies"
          Write-Host "  4b  - Entra ID Device Settings"
          Write-Host "  4c  - Defender Connector"
          Write-Host "   5  - SharePoint Settings"
          Write-Host "   6  - Consent Permissions"
          Write-Host "   7  - Intune Policies"
          Write-Host "  7b  - Chocolatey Apps"
          Write-Host "  7c  - WinGet Apps"
          Write-Host "  7d  - Custom Apps"
          Write-Host "  7e  - Defender for Endpoint Devices"
          Write-Host "  7f  - Intune Device Compliance Data"
          Write-Host "   8  - Exchange Online"
          Write-Host "   9  - Enterprise Applications"
          Write-Host "  10  - Entra Sign-In Logs (P1/P2 required)"
          Write-Host "=========================================="

      - name: Cleanup Job Session
        if: always()
        shell: pwsh
        run: |
          $connectScript = "${{ gitea.workspace }}/scripts/common/Connect-M365Graph.ps1"
          if (Test-Path $connectScript) {
            . $connectScript
            try { Disconnect-M365Connections } catch { Write-Host "##[warning]Cleanup disconnect: $_" }
          } elseif (Get-Command Disconnect-MgGraph -ErrorAction SilentlyContinue) {
            Disconnect-MgGraph -ErrorAction SilentlyContinue | Out-Null
          }
          if ($env:GITEA_RUN_ID) {
            Remove-Item -Path "/tmp/act-jobs/$($env:GITEA_RUN_ID)" -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "Removed job session: /tmp/act-jobs/$($env:GITEA_RUN_ID)"
          }
